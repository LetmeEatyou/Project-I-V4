      - name: Package and verify IPA
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail

          app_path="build/DerivedData/Build/Products/Release-iphoneos/ProjectIstiqamah.app"
          ipa_path="build/ProjectIstiqamah-unsigned.ipa"

          if [[ ! -d "$app_path" ]]; then
            echo "Expected app was not produced at $app_path" >&2
            find build/DerivedData/Build/Products -maxdepth 3 -type d -name "*.app" -print
            exit 1
          fi

          if codesign --verify "$app_path" >/dev/null 2>&1; then
            echo "Expected an unsigned app, but a valid signature was found" >&2
            exit 1
          fi

          rm -rf build/package
          mkdir -p build/package/Payload

          ditto "$app_path" "build/package/Payload/ProjectIstiqamah.app"

          (
            cd build/package
            /usr/bin/zip -qry "../ProjectIstiqamah-unsigned.ipa" Payload
          )

          unzip -tq "$ipa_path"
          test -s "$ipa_path"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: project-istiqamah-ios-unsigned
          path: artifacts/project-istiqamah/build/ProjectIstiqamah-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
